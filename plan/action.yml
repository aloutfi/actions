name: "Terraform Plan"
description: >-
  Run terraform init, validate and plan; parse the plan; optionally upload the
  binary planfile as an artifact; write the full plan to the job summary and
  upload it as plan.txt; and upsert a PR comment that links both.
  Provider credentials come from job-level `env:`, which composite steps
  inherit. Step-level `env:` on the `uses:` step does not reach them.

inputs:
  stack:
    description: Terraform working directory
    required: false
    default: "terraform/"
  workspace:
    description: Terraform workspace
    required: false
    default: "default"
  terraform_version:
    description: Terraform version
    required: false
    default: "1.15.3"
  output_planfile:
    description: Upload the binary planfile and plan-metadata.json as an artifact
    required: false
    default: "false"
  retention_days:
    description: >-
      Days to keep the planfile artifact. Apply fails if the artifact has
      expired by the time the PR merges, so keep this longer than PRs stay open.
    required: false
    default: "7"
  upload_plan_text:
    description: >-
      Upload the filtered plan text as an artifact (<plan_artifact_name>.txt,
      not zipped) and link it from the comment
    required: false
    default: "true"
  job_summary:
    description: Write the full filtered plan to the job summary and link it from the comment
    required: false
    default: "true"
  template:
    description: >-
      Path to a comment template file whose {{define}} blocks replace the
      default comment's blocks of the same name (TFPR_TEMPLATE)
    required: false
    default: ""
  mode:
    description: >-
      'pr' (default) or 'drift': a scheduled drift check that touches no PR. It
      writes the full plan to the job summary, sets the drifted output, and
      warns with the stack's name if anything drifted
    required: false
    default: "pr"
  fail_on_drift:
    description: In drift mode, fail the step when the stack drifted
    required: false
    default: "false"
  comment_author:
    description: Login that owns the PR comment. Only its comments are updated.
    required: false
    default: "github-actions[bot]"
  token:
    description: Token for GitHub API calls (PR comment, job link). Not exposed to terraform.
    required: false
    default: ${{ github.token }}

outputs:
  exit_code:
    description: terraform plan -detailed-exitcode (0=no changes, 2=changes)
    value: ${{ steps.plan.outputs.exit_code }}
  has_changes:
    description: "'true' | 'false'"
    value: ${{ steps.plan.outputs.has_changes }}
  has_imports:
    description: "'true' | 'false'"
    value: ${{ steps.plan.outputs.has_imports }}
  has_output_changes:
    description: Whether the plan contains output changes ('true' | 'false')
    value: ${{ steps.plan.outputs.has_output_changes }}
  summary:
    description: One-line "N to add, N to change, N to destroy, N to replace, N to import"
    value: ${{ steps.plan.outputs.summary }}
  plan_artifact_name:
    description: Artifact name for the planfile (uploaded when output_planfile=true)
    value: ${{ steps.plan.outputs.plan_artifact_name }}
  drifted:
    description: "Drift mode: 'true' when the plan would change anything"
    value: ${{ steps.comment.outputs.has_changes }}
  plan_text_url:
    description: Download URL of the plan.txt artifact (upload_plan_text=true)
    value: ${{ steps.plan-text-upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Locate tfpr
      id: tfpr
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/install-tfpr.sh"'

    # Unreleased refs (no checksums.txt entry) build tfpr from source.
    - name: Set up Go
      if: steps.tfpr.outputs.build == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false

    - name: Build tfpr
      id: tfpr-src
      if: steps.tfpr.outputs.build == 'true'
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/install-tfpr.sh" build'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - name: Terraform plan
      id: plan
      shell: bash
      env:
        TFPR: ${{ steps.tfpr.outputs.path || steps.tfpr-src.outputs.path }}
        TFPR_STACK: ${{ inputs.stack }}
        TFPR_WORKSPACE: ${{ inputs.workspace }}
        TFPR_MODE: ${{ inputs.mode }}
      run: '"${TFPR}" plan'

    - name: Upload plan artifact
      if: inputs.output_planfile == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.plan.outputs.plan_artifact_name }}
        path: |
          ${{ inputs.stack }}/tfplan
          ${{ inputs.stack }}/plan-metadata.json
        retention-days: ${{ inputs.retention_days }}
        if-no-files-found: error

    # With archive: false the file name is the artifact name, so it carries
    # the stack and workspace. The text was filtered when tfpr stored it.
    - name: Stage plan text
      id: plan-text
      if: inputs.upload_plan_text == 'true' && steps.plan.outputs.plan_text != ''
      shell: bash
      env:
        SRC: ${{ steps.plan.outputs.plan_text }}
        NAME: ${{ steps.plan.outputs.plan_artifact_name }}
      run: |
        dest="${RUNNER_TEMP}/${NAME}.txt"
        cp "${SRC}" "${dest}"
        echo "path=${dest}" >> "${GITHUB_OUTPUT}"

    - name: Upload plan text
      id: plan-text-upload
      if: steps.plan-text.outputs.path != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ steps.plan-text.outputs.path }}
        archive: false
        overwrite: true
        retention-days: ${{ inputs.retention_days }}
        if-no-files-found: error

    # Runs even when the plan failed: tfpr plan records the failure, and the
    # comment replaces the last good plan with "plan failed". Not on a
    # cancelled run, which may have been superseded by a newer, good plan.
    # Outside a pull request it writes only the job summary.
    - name: Job summary and PR comment
      id: comment
      if: ${{ !cancelled() }}
      shell: bash
      env:
        TFPR: ${{ steps.tfpr.outputs.path || steps.tfpr-src.outputs.path }}
        TFPR_STACK: ${{ inputs.stack }}
        TFPR_WORKSPACE: ${{ inputs.workspace }}
        TFPR_COMMENT_AUTHOR: ${{ inputs.comment_author }}
        TFPR_GITHUB_TOKEN: ${{ inputs.token }}
        TFPR_PLAN_TXT_URL: ${{ steps.plan-text-upload.outputs.artifact-url }}
        TFPR_SUMMARY: ${{ inputs.job_summary }}
        TFPR_TEMPLATE: ${{ inputs.template }}
        TFPR_MODE: ${{ inputs.mode }}
        TFPR_FAIL_ON_DRIFT: ${{ inputs.fail_on_drift }}
      run: '"${TFPR}" comment'
