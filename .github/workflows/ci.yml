name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          [[ -z "${unformatted}" ]] || { echo "::error::gofmt needed: ${unformatted}"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go.mod has no requires
        run: |
          if grep -q '^require' go.mod; then echo "::error::third-party Go modules are not allowed"; exit 1; fi
      - name: shellcheck
        run: shellcheck scripts/install-tfpr.sh test/run.sh test/fixtures/generate.sh
      - name: actionlint
        run: docker run --rm -v "${PWD}:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go test
        run: go test ./...
      - name: Black-box suite
        run: |
          CGO_ENABLED=0 go build -trimpath -o "${RUNNER_TEMP}/tfpr" ./cmd/tfpr
          TFPR_BIN="${RUNNER_TEMP}/tfpr" test/run.sh

  # Real terraform, from the oldest supported version to the newest: each
  # re-plans the fixtures, which must still render the goldens (resource ids
  # and hashes aside), and tfpr runs terraform itself on a fixture stack.
  # Keep the newest entry in step with the actions' terraform_version default.
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.15.9", "1.16.7", "1.17.1"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Re-plan the fixtures
        # Every case but large, whose 3,000 resources add minutes, not coverage.
        run: test/fixtures/generate.sh no-changes changes output-only truncated moved-removed moves-only forget import-update backticks html-stack
      - name: Black-box suite on the new plans
        run: |
          CGO_ENABLED=0 go build -trimpath -o "${RUNNER_TEMP}/tfpr" ./cmd/tfpr
          TFPR_BIN="${RUNNER_TEMP}/tfpr" test/run.sh --compat
      - name: tfpr plan
        env:
          TFPR_STACK: test/fixtures/stack
          TFPR_DIR: ${{ runner.temp }}/plan
          WANT: ${{ matrix.terraform }}
        run: |
          "${RUNNER_TEMP}/tfpr" plan
          "${RUNNER_TEMP}/tfpr" render > "${RUNNER_TEMP}/comment.md"
          grep -F "[terraform ${WANT}](https://github.com/hashicorp/terraform/releases/tag/v${WANT})" "${RUNNER_TEMP}/comment.md"

  # Dogfood: plan the fixture stacks with the local action so every PR gets
  # real plan comments: a small one, and a 3,000-resource one that shows the
  # truncation banner, the shortened resource list and the full-plan links.
  # No release covers this ref, so the action builds tfpr from source,
  # exercising the unreleased-ref install path. Fork PRs get a read-only
  # token, so skip them.
  dogfood:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # plan comment
      actions: read # job-log link in the comment
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: test/fixtures/stack
            bulk: ""
          - stack: test/fixtures/stack-large
            bulk: "3000"
    env:
      # Exercised end to end: the comment shows this for_each key redacted.
      TFPR_FILTER: sed -e 's/"alpha"/"[redacted]"/g'
      TF_VAR_bulk: ${{ matrix.bulk }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./plan
        with:
          stack: ${{ matrix.stack }}
          terraform_version: "1.17.1"
          output_planfile: "true"
