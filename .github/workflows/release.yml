name: release

# Builds tfpr for every supported platform, commits checksums.txt on a
# release commit, tags that commit v<version>, attests the archives and
# publishes them as a GitHub release.
#
# The release commit is reachable only from its tag, never from main. The
# composite actions download a release only when checksums.txt is in their
# own tree, so a pinned tag (or its commit sha) pins the binary's bytes, and
# every other ref builds from source.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the release
      id-token: write # build provenance
      attestations: write # build provenance
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the version
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::version '${VERSION}' is not semver without a leading v"
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::tag v${VERSION} already exists"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              exe=tfpr
              [[ "${os}" != windows ]] || exe=tfpr.exe
              stage="$(mktemp -d)"
              CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
                go build -trimpath -ldflags='-s -w -buildid=' -o "${stage}/${exe}" ./cmd/tfpr
              # Reproducible archive: fixed order, owner and timestamps.
              tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
                -C "${stage}" -cf - "${exe}" | gzip -n > "dist/tfpr_${VERSION}_${os}_${arch}.tar.gz"
            done
          done
          (cd dist && sha256sum -- *.tar.gz) > checksums.txt
          cp checksums.txt dist/
          cat checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Commit checksums.txt and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach
          git add checksums.txt
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "refs/tags/v${VERSION}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Pin the actions to \`v${VERSION}\` or to the tag's commit sha; the sums below are a convenience."
            echo "The trust root is \`checksums.txt\` committed at that tag."
            echo
            echo '```'
            cat checksums.txt
            echo '```'
          } > notes.md
          gh release create "v${VERSION}" dist/* --verify-tag --title "v${VERSION}" --notes-file notes.md
