name: "Resolve PR plan run"
description: >-
  From a merge commit SHA, find the workflow run that planned the PR's head
  commit. Emits an empty run_id on re-run, direct push (no PR), multiple PRs,
  or no successful run; pass it to the apply action's plan_artifact_run_id.
  The token needs `actions: read`.

inputs:
  plan_workflow_filename:
    description: File name of the workflow that ran the plan and uploaded the planfile (e.g. `pr.yaml`)
    required: false
    default: "pr.yaml"
  token:
    description: Token for GitHub API calls
    required: false
    default: ${{ github.token }}

outputs:
  run_id:
    description: Plan workflow run ID, or empty
    value: ${{ steps.resolve.outputs.run_id }}
  pr_number:
    description: PR number, or empty
    value: ${{ steps.resolve.outputs.pr_number }}

runs:
  using: composite
  steps:
    - name: Locate tfpr
      id: tfpr
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/install-tfpr.sh"'

    # Unreleased refs (no checksums.txt entry) build tfpr from source.
    - name: Set up Go
      if: steps.tfpr.outputs.build == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false

    - name: Build tfpr
      id: tfpr-src
      if: steps.tfpr.outputs.build == 'true'
      shell: bash
      run: '"${GITHUB_ACTION_PATH}/../scripts/install-tfpr.sh" build'

    - id: resolve
      shell: bash
      env:
        TFPR: ${{ steps.tfpr.outputs.path || steps.tfpr-src.outputs.path }}
        TFPR_PLAN_WORKFLOW: ${{ inputs.plan_workflow_filename }}
        GH_TOKEN: ${{ inputs.token }}
      run: '"${TFPR}" resolve-plan-run'
